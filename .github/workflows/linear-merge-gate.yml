name: Linear Merge Gate
# Human Gate: Linear で `Merge Approved` にされた Issue の PR をマージする
on:
  schedule:
    # 毎時 0 分の混雑を避けてオフセットする（GitHub の cron はベストエフォート）
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: { group: linear-merge-gate }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/linear-merge-gate.mjs
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
